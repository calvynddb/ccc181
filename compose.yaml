services:
  db:
    image: postgres:17
    container_name: mito-db
    environment:
      POSTGRES_USER: mito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mito
    ports:
      - "5432:5432"
    volumes:
      - mito_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mito -d mito"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mito_pgdata: